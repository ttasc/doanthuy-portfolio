name: Auto Convert YAML to JSON

on:
  push:
    branches: ["master"] # Nếu nhánh của bạn tên là "master", hãy đổi lại thành "master"
    paths:
      - 'data.yaml' # Chỉ kích hoạt workflow này khi file yaml bị sửa

permissions:
  contents: write # Cấp quyền để con bot có thể commit ngược code lại repo

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tải code về máy ảo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng để bot có thể push code

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Cài đặt thư viện js-yaml
        run: npm install js-yaml

      - name: 4. Chạy script đồng bộ ra data.js
        run: node build-data.js

      - name: 5. Bot tự động Commit và Push file JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js

          # Chỉ commit nếu thực sự có thay đổi
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.js from data.yaml" && git push)
