name: Tối ưu Nội dung & Hình ảnh

on:
  push:
    branches:
      - master
    paths:
      - 'data.json'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền để Action có thể commit code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện xử lý ảnh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Chạy Script Tối ưu và Build data.js
        run: python scripts/build.py

      - name: Commit file đã tối ưu về lại Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-optimize images to webp and build data.js"
